[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowdollars"
version = "0.1.0"
description = "Stablecoin rails, scam finance and detection methods: replication package"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "networkx", "matplotlib", "statsmodels", "requests"]

[project.urls]
Homepage = "https://thanatchon36.github.io/shadow-dollars/paper/"
Repository = "https://github.com/thanatchon36/shadow-dollars"

[project.optional-dependencies]
exchange = ["ccxt"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
